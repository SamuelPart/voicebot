# CÓMO ACTIVARLO
#   mkdir -p .github/workflows
#   cp android/ci/github-workflow.yml .github/workflows/android.yml
#   git add .github/workflows/android.yml && git commit -m "CI: tests y compilación Android" && git push
#
# Queda aquí (y no en .github/workflows) a propósito: añadir archivos de workflow requiere un
# token con permiso `workflows`. Copiarlo cuando tengas ese permiso disponible.
name: Android — tests y compilación

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    name: Filtro + compilación (Fase 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests del filtro y del motor de voz (JVM)
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK de debug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Subir reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
